name: Neural network coordination verification

on:
  push:
    paths:
      - 'src/axm_neural_network/**'
      - 'tests/**'
      - 'provenance/cross-repo-network-pattern-donors-v0.1.json'
      - '.github/workflows/neural-network.yml'
  pull_request:
    paths:
      - 'src/axm_neural_network/**'
      - 'tests/**'
      - '.github/workflows/neural-network.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned integrity-tested Neural Core for bridge tests
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-neural-brain
          ref: ca750603acefeb5f4bd340d1c08767cd9c18c38a
          path: neural-brain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional independent numerical backend
        run: python -m pip install numpy==2.3.5
      - name: Run coordination, host bridge and neural substrate tests
        run: PYTHONPATH=src:neural-brain python -m unittest discover -s tests -v
