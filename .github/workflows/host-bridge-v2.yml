name: Host experience bridge v2 cross-repo verification

on:
  push:
    paths:
      - 'src/axm_neural_network/host_bridge.py'
      - 'tests/test_host_bridge_v2.py'
      - '.github/workflows/host-bridge-v2.yml'
  pull_request:
    paths:
      - 'src/axm_neural_network/host_bridge.py'
      - 'tests/test_host_bridge_v2.py'
      - '.github/workflows/host-bridge-v2.yml'

permissions:
  contents: read

jobs:
  real-core-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout neural network
        uses: actions/checkout@v4

      - name: Checkout pinned Neural Core
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-neural-brain
          ref: ca750603acefeb5f4bd340d1c08767cd9c18c38a
          path: neural-brain

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run bridge v2 against pinned real Neural Core
        run: PYTHONPATH=src:neural-brain python -m unittest discover -s tests -p test_host_bridge_v2.py -v
